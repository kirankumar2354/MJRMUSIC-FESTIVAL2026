
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJR Festival - Login</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
                        url("images/background.jpg");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: #171717;
            padding: 35px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }

        .login-container h2 {
            text-align: center;
            color: orange;
            margin-bottom: 10px;
        }

        .login-container p {
            text-align: center;
            color: #ccc;
            margin-bottom: 25px;
        }

        .login-container label {
            display: block;
            margin-bottom: 8px;
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #555;
            border-radius: 6px;
            background: #292929;
            color: white;
            outline: none;
        }

        .login-container input:focus {
            border-color: orange;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: orange;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #ffbd45;
        }

        .login-container .signup-link {
            margin-top: 20px;
            font-size: 14px;
        }

        .signup-link a,
        .back-link a {
            color: orange;
            text-decoration: none;
        }

        .back-link {
            text-align: center;
            margin-top: 15px;
        }

        #loginMessage {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h2>MJR Music Festival</h2>
        <p>Login to book your tickets</p>

        <form id="loginForm">

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <button type="submit" class="login-btn">Login</button>

        </form>

        <div id="loginMessage"></div>

        <p class="signup-link">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>

        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
